<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rokib - 262505003 - Kalkulator Modular Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            background: #55b9e8;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Awan */
        .cloud {
            position: fixed;
            font-size: 65px;
            color: white;
            z-index: -1;
        }

        .cloud1 { top: 15%; left: 8%; }
        .cloud2 { top: 10%; right: 10%; }
        .cloud3 { bottom: 10%; left: 17%; }
        .cloud4 { bottom: 20%; right: 10%; }

        /* Kotak utama */
        .container {
            width: 590px;
            max-width: 100%;
            background: #fff3d6;
            border: 6px solid #55300c;
            box-shadow: 12px 12px 0 #333;
            padding: 26px;
        }

        /* Header */
        .header {
            background: #ed382f;
            border: 4px solid #75300c;
            color: white;
            text-align: center;
            padding: 25px 10px;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {
            font-weight: bold;
            margin-bottom: 0;
        }

        /* Icon */
        .icons {
            display: flex;
            justify-content: space-around;
            font-size: 30px;
            margin-bottom: 25px;
        }

        /* Input */
        label {
            display: block;
            font-size: 17px;
            font-weight: bold;
            color: #654321;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 4px solid #654321;
            background: white;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus {
            border-color: #e63b32;
        }

        /* Tombol */
        button {
            width: 100%;
            padding: 17px;
            border: 4px solid #654321;
            font-family: monospace;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
        }

        .btn-hitung {
            background: #32b34a;
            color: white;
        }

        .btn-reset {
            background: #ffcc35;
            color: #654321;
        }

        /* Hasil */
        .hasil {
            background: #d8f5ce;
            border: 3px dashed #4b9853;
            margin-top: 15px;
            padding: 25px 10px;
            text-align: center;
            min-height: 220px;
        }

        .hasil h3 {
            color: #28733b;
        }

        .rumus {
            font-size: 17px;
            font-weight: bold;
            margin-top: 25px;
        }

        .angka {
            color: #e53935;
            font-size: 40px;
            font-weight: bold;
            margin: 15px 0;
        }

        /* Footer */
        .footer {
            text-align: center;
            color: #654321;
            font-weight: bold;
            margin-top: 30px;
            line-height: 1.8;
        }

        @media(max-width: 480px) {
            .container {
                padding: 18px;
            }

            .header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <!-- Awan -->
    <div class="cloud cloud1">☁</div>
    <div class="cloud cloud2">☁</div>
    <div class="cloud cloud3">☁</div>
    <div class="cloud cloud4">☁</div>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>CALCULATOR</h1>
            <p>SUPER MODULAR GAME</p>
        </div>

        <!-- Icon -->
        <div class="icons">
            <span>🍄</span>
            <span>🪙</span>
            <span>⭐</span>
            <span>🧱</span>
        </div>

        <!-- Input Bilangan -->
        <label for="bilangan">BILANGAN (a)</label>
        <input type="number" id="bilangan" value="15">

        <!-- Input Modulus -->
        <label for="modulus">MODULUS (m)</label>
        <input type="number" id="modulus" value="2">

        <!-- Tombol Hitung -->
        <button class="btn-hitung" onclick="hitung()">
            ▶ HITUNG HASIL
        </button>

        <!-- Tombol Reset -->
        <button class="btn-reset" onclick="resetGame()">
            ↻ RESET GAME
        </button>

        <!-- Kotak Hasil -->
        <div class="hasil">

            <h3>⭐ LEVEL COMPLETED ⭐</h3>

            <div class="rumus" id="rumus">
                HASIL AKAN MUNCUL DI SINI
            </div>

            <p>HASIL MODULAR:</p>

            <div class="angka" id="angka">
                ?
            </div>

        </div>

        <!-- Footer -->
        <div class="footer">
            <p>🌸 NAMA MAHASISWA 🌸</p>
            <p>NIM MAHASISWA</p>
        </div>

    </div>

    <!-- JavaScript -->
    <script>

        function hitung() {

            // Mengambil nilai input
            let a = parseInt(document.getElementById("bilangan").value);
            let m = parseInt(document.getElementById("modulus").value);

            // Memeriksa input
            if (isNaN(a) || isNaN(m)) {
                alert("Masukkan bilangan terlebih dahulu!");
                return;
            }

            if (m <= 0) {
                alert("Modulus harus lebih besar dari 0!");
                return;
            }

            // Menghitung aritmatika modular
            let hasil = ((a % m) + m) % m;

            // Menampilkan hasil
            document.getElementById("rumus").innerHTML =
                a + " mod " + m;

            document.getElementById("angka").innerHTML = hasil;

        }

        // Fungsi Reset
        function resetGame() {

            document.getElementById("bilangan").value = 15;

            document.getElementById("modulus").value = 2;

            document.getElementById("rumus").innerHTML =
                "HASIL AKAN MUNCUL DI SINI";

            document.getElementById("angka").innerHTML = "?";

        }

    </script>

</body>
</html>
