
<!DOCTYPE html>
<html>
<head>
    <title>Rokib - 262505003 -Kalkulator Modular</title>
</head>
<body>

    <h2>Kalkulator Aritmatika Modular</h2>

    <label>Masukkan Angka:</label>
    <input type="number" id="angka">

    <br><br>

    <label>Masukkan Modulus:</label>
    <input type="number" id="modulus">

    <br><br>

    <button onclick="hitungModular()">
        Hitung
    </button>

    <h3 id="hasil">Hasil: -</h3>

    <script>
        function hitungModular() {

            let angka = Number(
                document.getElementById("angka").value
            );

            let modulus = Number(
                document.getElementById("modulus").value
            );

            if (
                document.getElementById("angka").value === "" ||
                document.getElementById("modulus").value === "" ||
                !Number.isInteger(angka) ||
                !Number.isInteger(modulus) ||
                modulus <= 0
            ) {
                document.getElementById("hasil").innerHTML =
                    "Masukkan bilangan bulat dan modulus positif!";
                return;
            }

            let hasil = ((angka % modulus) + modulus) % modulus;

            document.getElementById("hasil").innerHTML =
                "Hasil: " + hasil;
        }
    </script>

</body>
</html>
