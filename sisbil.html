
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3>Kalkulator Sistem Bilangan</h3>
                    </div>

                    <div class="card-body">

                        <!-- Input Bilangan -->
                        <div class="mb-3">
                            <label for="bilangan" class="form-label">
                                Masukkan Bilangan
                            </label>

                            <input
                                type="text"
                                id="bilangan"
                                class="form-control"
                                placeholder="Contoh: 1010"
                            >
                        </div>

                        <!-- Sistem Bilangan Asal -->
                        <div class="mb-3">
                            <label for="asal" class="form-label">
                                Sistem Bilangan Asal
                            </label>

                            <select id="asal" class="form-select">
                                <option value="2">Biner (Basis 2)</option>
                                <option value="10" selected>Desimal (Basis 10)</option>
                                <option value="8">Oktal (Basis 8)</option>
                                <option value="16">Heksadesimal (Basis 16)</option>
                            </select>
                        </div>

                        <!-- Sistem Bilangan Tujuan -->
                        <div class="mb-3">
                            <label for="tujuan" class="form-label">
                                Konversi Ke
                            </label>

                            <select id="tujuan" class="form-select">
                                <option value="2">Biner (Basis 2)</option>
                                <option value="10">Desimal (Basis 10)</option>
                                <option value="8">Oktal (Basis 8)</option>
                                <option value="16" selected>Heksadesimal (Basis 16)</option>
                            </select>
                        </div>

                        <!-- Tombol Konversi -->
                        <div class="d-grid">
                            <button
                                type="button"
                                class="btn btn-primary"
                                onclick="konversikan()"
                            >
                                Konversi
                            </button>
                        </div>

                        <hr>

                        <!-- Label Hasil -->
                        <div class="text-center">
                            <p class="text-muted mb-1">Hasil Konversi:</p>

                            <div
                                id="hasil"
                                class="fs-2 fw-bold text-success"
                            >
                                -
                            </div>

                            <div id="pesan" class="text-danger mt-2"></div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function konversikan() {

            // Mengambil nilai input dan pilihan sistem bilangan
            let bilangan = document.getElementById("bilangan").value.trim();
            let asal = parseInt(document.getElementById("asal").value);
            let tujuan = parseInt(document.getElementById("tujuan").value);

            let hasilLabel = document.getElementById("hasil");
            let pesanLabel = document.getElementById("pesan");

            // Memeriksa apakah input kosong
            if (bilangan === "") {
                hasilLabel.textContent = "-";
                pesanLabel.textContent = "Masukkan bilangan terlebih dahulu!";
                return;
            }

            // Mengubah input menjadi huruf besar
            bilangan = bilangan.toUpperCase();

            // Memeriksa apakah input sesuai dengan sistem bilangan asal
            let pola = {
                2: /^[01]+$/,
                8: /^[0-7]+$/,
                10: /^[0-9]+$/,
                16: /^[0-9A-F]+$/
            };

            if (!pola[asal].test(bilangan)) {
                hasilLabel.textContent = "-";
                pesanLabel.textContent =
                    "Input tidak valid untuk sistem bilangan yang dipilih!";
                return;
            }

            // Mengubah bilangan asal menjadi desimal
            let desimal = parseInt(bilangan, asal);

            // Mengubah desimal menjadi sistem bilangan tujuan
            let hasil = desimal.toString(tujuan).toUpperCase();

            // Menampilkan hasil konversi
            hasilLabel.textContent = hasil;
            pesanLabel.textContent = "";
        }
    </script>

</body>
</html>
