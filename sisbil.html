<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sistem Bilangan</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">Kalkulator Sistem Bilangan</h4>
                    </div>
                    <div class="card-body">
                        
                        <!-- Input Bilangan -->
                        <div class="mb-3">
                            <label for="inputAngka" class="form-label">Masukkan Angka/Nilai:</label>
                            <input type="text" id="inputAngka" class="form-control" placeholder="Contoh: 1010 atau 255 atau FF">
                        </div>

                        <!-- Select Sistem Bilangan Asal -->
                        <div class="mb-3">
                            <label for="sistemAsal" class="form-label">Dari Sistem Bilangan:</label>
                            <select id="sistemAsal" class="form-select">
                                <option value="10">Desimal (Basis 10)</option>
                                <option value="2">Biner (Basis 2)</option>
                                <option value="8">Oktal (Basis 8)</option>
                                <option value="16">Heksadesimal (Basis 16)</option>
                            </select>
                        </div>

                        <!-- Select Sistem Bilangan Tujuan -->
                        <div class="mb-3">
                            <label for="sistemTujuan" class="form-label">Ke Sistem Bilangan:</label>
                            <select id="sistemTujuan" class="form-select">
                                <option value="10">Desimal (Basis 10)</option>
                                <option value="2" selected>Biner (Basis 2)</option>
                                <option value="8">Oktal (Basis 8)</option>
                                <option value="16">Heksadesimal (Basis 16)</option>
                            </select>
                        </div>

                        <!-- Tombol Konversi -->
                        <div class="d-grid mb-4">
                            <button class="btn btn-primary btn-lg" onclick="konversikan()">Konversi</button>
                        </div>

                        <!-- Label Hasil Ukuran Besar -->
                        <div class="text-center p-3 bg-light rounded border">
                            <small class="text-muted d-block text-uppercase fw-bold">Hasil Konversi</small>
                            <span id="labelHasil" class="display-4 fw-bold text-success">-</span>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript untuk Fungsi Konversi -->
    <script>
        function konversikan() {
            // Mengambil element input, select, dan label hasil
            const inputAngka = document.getElementById('inputAngka').value.trim();
            const basisAsal = parseInt(document.getElementById('sistemAsal').value);
            const basisTujuan = parseInt(document.getElementById('sistemTujuan').value);
            const labelHasil = document.getElementById('labelHasil');

            // Validasi jika input kosong
            if (inputAngka === "") {
                labelHasil.classList.remove('text-success');
                labelHasil.classList.add('text-danger');
                labelHasil.innerText = "Input Kosong!";
                return;
            }

            try {
                // Langkah 1: Ubah nilai input dari basis asal menjadi angka desimal (integer)
                let desimal = parseInt(inputAngka, basisAsal);

                // Validasi jika format angka tidak sesuai dengan basis asal (NaN)
                if (isNaN(desimal)) {
                    throw new Error("Format tidak valid");
                }

                // Langkah 2: Ubah dari desimal ke basis tujuan
                // toString(basis) secara otomatis mengubah basis, khusus heksadesimal diubah ke huruf kapital (.toUpperCase())
                let hasil = desimal.toString(basisTujuan).toUpperCase();

                // Langkah 3: Tampilkan hasil pada label berukuran besar
                labelHasil.classList.remove('text-danger');
                labelHasil.classList.add('text-success');
                labelHasil.innerText = hasil;

            } catch (error) {
                // Tampilkan pesan error jika input tidak sesuai dengan basis sistem bilangan yang dipilih
                labelHasil.classList.remove('text-success');
                labelHasil.classList.add('text-danger');
                labelHasil.innerText = "Format Salah!";
            }
        }
    </script>

    <!-- Bootstrap 5 JS Bundle CDN (Opsional untuk fitur dropdown/interaktif Bootstrap) -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
